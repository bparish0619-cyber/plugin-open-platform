# Publishes the MemoMind BLE client as a GitHub release, either
#  - when a tag like android-client-v0.2.0 is pushed (it must match VERSION_NAME
#    in AndroidClient/build.sh), or
#  - from Actions > "Android client release" > Run workflow on main, which
#    creates tag android-client-v<VERSION_NAME> on the selected commit.
# Re-running for an existing release replaces its APK.
name: Android client release

on:
  push:
    tags: ['android-client-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/android-client.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: memomind-ble-client-apk
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          VERSION=$(AndroidClient/build.sh version)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$TAG" != "android-client-v$VERSION" ]; then
              echo "Tag $TAG does not match build.sh version $VERSION" >&2
              exit 1
            fi
          else
            # Manual run: the release tag comes from build.sh.
            TAG="android-client-v$VERSION"
          fi
          # Release notes: this version's CHANGELOG section plus install/signing notes.
          awk -v v="## $VERSION" '$0 ~ "^## " { f = ($0 == v || index($0, v " ") == 1); next } f' \
            AndroidClient/CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo "Download \`memomind-ble-client-$VERSION.apk\` below and open it on the phone (Android 6.0+),"
            echo "or run \`adb install -r memomind-ble-client-$VERSION.apk\`."
            if [ "$RELEASE_SIGNED" != "true" ]; then
              echo
              echo "Signed with a CI debug key: uninstall any earlier build before installing."
            fi
          } >> notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Already published (re-run, or created in the GitHub UI): refresh assets and notes.
            gh release upload "$TAG" release/*.apk --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            # --target creates the tag at this commit when it does not exist yet.
            gh release create "$TAG" release/*.apk --target "$GITHUB_SHA" \
              --title "MemoMind BLE Client $VERSION" --notes-file notes.md
          fi
