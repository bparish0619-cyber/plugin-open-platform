# Publishes a GitHub release when a tag like android-client-v0.2.0 is pushed.
# The tag version must match VERSION_NAME in AndroidClient/build.sh.
name: Android client release

on:
  push:
    tags: ['android-client-v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/android-client.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: memomind-ble-client-apk
          path: release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          VERSION=$(AndroidClient/build.sh version)
          if [ "$TAG" != "android-client-v$VERSION" ]; then
            echo "Tag $TAG does not match build.sh version $VERSION" >&2
            exit 1
          fi
          # Release notes: this version's CHANGELOG section plus install/signing notes.
          awk -v v="## $VERSION" '$0 ~ "^## " { f = ($0 == v || index($0, v " ") == 1); next } f' \
            AndroidClient/CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo "Download \`memomind-ble-client-$VERSION.apk\` below and open it on the phone (Android 6.0+),"
            echo "or run \`adb install -r memomind-ble-client-$VERSION.apk\`."
            if [ "$RELEASE_SIGNED" != "true" ]; then
              echo
              echo "Signed with a CI debug key: uninstall any earlier build before installing."
            fi
          } >> notes.md
          gh release create "$TAG" release/*.apk \
            --title "MemoMind BLE Client $VERSION" --notes-file notes.md
